name: Deploy to Fly

# Deploying without a computer.
#
# `fly deploy` normally runs from a laptop, which means installing the Fly
# tool and leaving an account login on that machine. Running it here instead
# means the deploy happens on GitHub's servers: nothing to install, and no
# credential left behind on a borrowed or work computer.
#
# Two ways it runs:
#   - the "Run workflow" button on the Actions tab, any time you want
#   - automatically, whenever the branch changes
#
# Needs one repository secret, FLY_API_TOKEN. See DEPLOY.md.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/shared-roommate-calendar-0x23o9

# One deploy at a time. Two overlapping ones would fight over the single
# machine that holds the database.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  # The gate. Nothing reaches the phones unless the date maths, the recurring
  # event expansion, the price parsing and the calendar layout all still behave.
  # These are the parts whose bugs are invisible until they're embarrassing:
  # a class on the wrong day, a price that isn't the price.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        # v7 runs on Node 24. v4 targets Node 20, which runners now force onto
        # 24 anyway while printing a deprecation warning on every run.
        uses: actions/checkout@v7

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # --remote-only builds the image on Fly's builders rather than here.
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
