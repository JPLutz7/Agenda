# Fly.io deployment. See DEPLOY.md.
#
# THE ONE RULE: run exactly one machine. The database is a SQLite file on the
# volume below, and a Fly volume attaches to a single machine. A second machine
# gets its own empty volume, so you and your roommate would land on different
# databases depending on which one served the request — and neither would look
# broken. `fly launch` offers to create two machines for high availability.
# Say no. See `fly scale count 1` in DEPLOY.md.

app = "agenda-nd"

# Chicago — the closest Fly region to South Bend, about 90 miles away.
# The volume must be created in this same region.
primary_region = "ord"

[build]

[env]
  AGENDA_DB_PATH = "/data/agenda.db"
  PORT = "3000"
  # Where this app answers. Notifications need it: it goes into every push as
  # the "who to contact about this traffic" claim, and Apple refuses anything
  # that isn't a real address — a placeholder means nothing is ever delivered,
  # with both phones still showing as registered. Change this if the app moves.
  AGENDA_PUBLIC_URL = "https://agenda-nd.fly.dev"

# The household's data. Without this the SQLite file lives in the container's
# temporary filesystem and every deploy wipes it.
[[mounts]]
  source = "agenda_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on, deliberately. Sleeping would be cheaper, but it also means no
  # cold-start delay when you open the app and — more importantly — the
  # background calendar sync in src/instrumentation.ts actually runs, so
  # iCloud data is already current before either of you looks at it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
